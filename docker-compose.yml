version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lucidcredit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lucidcredit
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucidcredit"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # LLM Provider Configuration
  # Primary: Azure OpenAI (set AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_API_KEY)
  # Fallback: Vertex AI (set GOOGLE_PROJECT_ID; use ADC or GOOGLE_APPLICATION_CREDENTIALS)
  # See .env.example for full variable list.
  # NEVER commit .env with real API keys.
  copilot-api:
    build: ./backend
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      # Override localhost URLs from .env with Docker service names
      DATABASE_URL: postgresql+asyncpg://lucidcredit:password@db:5432/lucidcredit
      VECTOR_DB_URL: postgresql+asyncpg://lucidcredit:password@db:5432/lucidcredit
      REDIS_URL: redis://redis:6379
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
      # Analytics API runs on the host — use host.docker.internal so the container
      # can reach it (127.0.0.1 inside Docker resolves to the container loopback)
      CRP_API_BASE_URL: http://host.docker.internal:8001
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/app/credentials/gcp-key.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  copilot-ui:
    build: ./frontend
    ports:
      - "3010:3000"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      - copilot-api

volumes:
  pgdata:
