version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lucidcredit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lucidcredit
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # LLM Provider Configuration
  # Primary: Azure OpenAI (set AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_API_KEY)
  # Fallback: Vertex AI (set GOOGLE_PROJECT_ID; use ADC or GOOGLE_APPLICATION_CREDENTIALS)
  # See .env.example for full variable list.
  # NEVER commit .env with real API keys.
  copilot-api:
    build: ./backend
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      # Mount GCP service account key into the container when GOOGLE_APPLICATION_CREDENTIALS
      # is set on the host (ADC path). Falls back to /dev/null (no-op) when not set.
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-key.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/app/credentials/gcp-key.json:ro
    depends_on:
      - db
      - redis

  copilot-ui:
    build: ./frontend
    ports:
      - "3010:3000"
    env_file: .env
    depends_on:
      - copilot-api

volumes:
  pgdata:
