name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint + unit + integration tests ─────────────────────────────────
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lucidcredit
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lucidcredit
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U lucidcredit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Use dummy credentials so the Settings validator passes without Azure
      ANALYST_FALLBACK_ENABLED: "false"
      AZURE_OPENAI_ENDPOINT: "https://dummy.openai.azure.com/"
      AZURE_OPENAI_API_KEY: "dummy-key-for-ci-00000000000000000000"
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-large"
      AZURE_OPENAI_CHAT_DEPLOYMENT: "gpt-4.1-2025-04-14"
      AZURE_OPENAI_API_VERSION: "2024-10-21"
      DATABASE_URL: "postgresql+asyncpg://lucidcredit:password@localhost:5440/lucidcredit"
      REDIS_URL: "redis://localhost:6380"
      GOOGLE_PROJECT_ID: "dummy-project-for-ci"
      ENVIRONMENT: "test"
      JWT_SECRET_KEY: "ci-test-secret-key-00000000000000000000"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ tests/ --output-format=github

      - name: Type-check with mypy
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # advisory until strict typing is enforced

      - name: Run Alembic migrations (test DB)
        run: alembic upgrade head

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Run hallucination regression tests
        run: pytest tests/eval/test_hallucination_regression.py -v --tb=short

  # ── Frontend: typecheck + build ───────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8090"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true  # advisory — warnings don't fail the build

      - name: Build
        run: npm run build
